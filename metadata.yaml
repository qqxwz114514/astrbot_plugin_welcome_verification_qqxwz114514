name: astrbot_plugin_welcome_verification_qqxwz114514  # 插件标识符，英文，唯一
display_name: 入群欢迎与验证                       # 插件展示名称
# short_desc: 一句话介绍你的插件功能              # （可选）紧凑 UI 使用的短描述
desc: |
  基于月凌的 astrbot_plugin_welcome_verification 二次开发的入群欢迎与验证插件。
  新增：群白名单、答错/答非所问自动撤回、机器人管理员权限前置检查。
  支持自定义欢迎文本、图片、题库，支持为不同群组设置独立配置。
version: 1.0.2                                  # 插件版本号（遵循语义化版本规范）
author: qqxwz114514                             # 作者名称
